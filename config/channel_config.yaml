channel:
  name: "HabitScience Lab"
  handle: "@habitsciencelab"
  niche: "Science-Backed Focus, Habits & Cognitive Performance"
  target_audience: "Ambitious professionals, founders, students, and lifelong learners worldwide"
  language: "en"
  tone: "calm, authoritative, science-backed, deeply practical, zero fluff"
  cta_youtube: "Subscribe to HabitScience Lab and grab the free 7-Day Focus Reset Protocol in the description to rewire your attention."
  cta_social: "Save this for your next deep-work session and comment 'RESET' to get the 7-Day Protocol checklist."

branding:
  # Minimalist Hand-Drawn / Ink Sketch Editorial Palette (Matte Charcoal Notebook)
  primary_color: "#2DD4BF"
  secondary_color: "#38BDF8"
  accent_color: "#F59E0B"
  bg_dark: "#111317"
  bg_card: "#191C22"
  text_primary: "#F5F2EB"
  text_muted: "#B8B5AD"
  watermark_text: "@habitsciencelab"
  font_bold: "bahnschrift.ttf"
  font_regular: "segoeui.ttf"

visual:
  style: "minimalist_ink_sketch"
  cinematic_full_bleed: true
  prompt_prefix: >-
    Minimalist hand-drawn white chalk and ink editorial line-art illustration on
    matte dark charcoal sketchbook paper (#111317), refined Dan Koe and New Yorker
    visual-note aesthetic, clean uncluttered negative space, single subtle teal
    (#2DD4BF) and warm amber (#F59E0B) chalk highlighter accent, strictly NO text,
    NO letters, NO words, NO numbers anywhere in the image.

ai:
  text_model: "gemini-3.8-flash"
  image_model: "gemini-3.1-flash-image"
  use_gemini_images: true
  temperature: 0.7

voiceover:
  # Primary: Gemini Native Studio TTS (falls back to edge_tts only if API unavailable)
  provider: "gemini_tts"
  gemini_tts_model: "gemini-3.8-flash-tts"
  gemini_voice_long: "Charon"
  gemini_voice_shorts: "Aoede"
  style_prompt_long: >-
    Speak as a warm, calm, authoritative science documentary narrator (similar in
    energy to Veritasium or Kurzgesagt). Use natural human cadence, thoughtful
    micro-pauses between key ideas, subtle natural breath, and crisp clarity—never
    rushed or robotic. Read ONLY the narration script below:
  style_prompt_shorts: >-
    Speak as an articulate, warm, engaging modern science storyteller with clean
    pacing, natural conversational inflection, and subtle emphasis on key insights.
    Read ONLY the narration script below:
  loudnorm: true
  # Edge TTS fallback settings
  voice_long: "en-US-BrianNeural"
  voice_shorts: "en-US-AvaNeural"
  rate_long: "+0%"
  rate_shorts: "+6%"
  pitch: "+0Hz"

video:
  ken_burns_motion: true
  youtube_long:
    width: 1920
    height: 1080
    fps: 30
    burn_subtitles: true
    padding_after_audio_sec: 0.55
  shorts:
    width: 1080
    height: 1920
    fps: 30
    burn_subtitles: true
    max_duration_sec: 59
    padding_after_audio_sec: 0.35

platforms:
  youtube_long:
    enabled: true
    category_id: "27"
    draft_privacy: "private"
    publish_privacy: "public"
    made_for_kids: false
  youtube_shorts:
    enabled: true
    category_id: "27"
    draft_privacy: "private"
    publish_privacy: "public"
    made_for_kids: false
  instagram_reels:
    enabled: true
    adapter: "webhook"
  instagram_carousel:
    enabled: true
    slide_count: 5
    adapter: "webhook"
  tiktok:
    enabled: true
    adapter: "webhook"
  linkedin:
    enabled: true
    adapter: "webhook"
  x_threads:
    enabled: true
    adapter: "webhook"
  facebook:
    enabled: true
    adapter: "webhook"

publishing:
  default_mode: "draft"
  save_payload_snapshots: true

trends:
  locale_hl: "en-US"
  locale_gl: "US"
  locale_ceid: "US:en"
  queries:
    - "neuroscience focus attention dopamine study"
    - "habit formation behavioral psychology research"
    - "deep work sleep cognitive performance science"
  custom_rss_feeds: []
