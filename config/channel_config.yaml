channel:
  name: "HabitSains"
  handle: "@HabitSains"
  niche: "Science-Backed Focus, Habits & Cognitive Performance"
  target_audience: "Ambitious professionals, founders, students, and lifelong learners worldwide"
  language: "en"
  tone: "charismatic storyteller, warm science presenter, vivid metaphors, intriguing hooks, zero fluff"
  cta_youtube: "Subscribe to HabitSains and grab the free 7-Day Focus Reset Protocol in the description to rewire your attention."
  cta_social: "Save this for your next deep-work session and comment 'RESET' to get the 7-Day Protocol checklist."

branding:
  # Studio v5 — Flat Vector 2D Explainer Palette (Kurzgesagt / TED-Ed vibe)
  primary_color: "#2DD4BF"
  secondary_color: "#FF7666"
  accent_color: "#FBBF24"
  bg_dark: "#121338"
  bg_card: "#1D2052"
  text_primary: "#F8FAFC"
  text_muted: "#C7D2FE"
  watermark_text: "@HabitSains"
  font_bold: "bahnschrift.ttf"
  font_regular: "segoeui.ttf"

visual:
  style: "cinematic_illustrated"
  cinematic_full_bleed: true
  # Hide heavy lower-third when full-bleed art is active so animated .ASS captions shine unobstructed
  minimal_chapter_overlay: true
  prompt_prefix: >-
    Rich cinematic illustrated storytelling artwork inspired by Kurzgesagt, Johnny
    Harris, and high-budget science documentary illustration. Dramatic volumetric
    lighting, expressive visual storytelling metaphor, deep midnight indigo shadows
    balanced with luminous teal (#14B8A6), electric cyan (#38BDF8), and warm amber
    gold (#F59E0B) highlights, crisp editorial composition with subtle darker space
    near the bottom edge for subtitles. Strictly NO text, NO letters, NO words, NO
    numbers, NO watermarks anywhere in the image.

ai:
  text_model: "gemini-3.8-flash"
  # Free Cloud Image Generation order:
  # 1) Antigravity --custom-assets (100% Free locally)
  # 2) Cloudflare Workers AI FLUX.1-schnell (100% Free tier in Cloud / GitHub Actions!)
  # 3) Gemini Image API (if billing enabled)
  use_cloudflare_flux: true
  cloudflare_image_model: "@cf/black-forest-labs/flux-1-schnell"
  use_gemini_images: true
  image_model: "gemini-3.1-flash-image"
  temperature: 0.78

voiceover:
  provider: "gemini_tts"
  gemini_tts_model: "gemini-3.8-flash-tts"
  # Expressive Presenter / Storyteller voices
  gemini_voice_long: "Puck"
  gemini_voice_shorts: "Zephyr"
  style_prompt_long: >-
    Speak as a charismatic, warm, captivating YouTube science host and master
    storyteller (similar in vocal energy to Johnny Harris meets Ali Abdaal and
    Veritasium). Vary your pitch and rhythm naturally: open with genuine intrigue,
    lean in on surprising discoveries, add crisp conversational micro-pauses before
    key twists, and sound warm and encouraging on practical takeaways—never flat,
    never monotone, never robotic. Read ONLY the spoken transcript below naturally:
  style_prompt_shorts: >-
    Speak as a magnetic, expressive science storyteller and presenter for short-form
    video. Hook attention in the first second with curiosity, use lively dynamic
    inflection, punch key numbers and turning points, and keep natural human flow.
    Read ONLY the spoken transcript below naturally:
  loudnorm: true
  # Edge TTS fallback
  voice_long: "en-US-BrianNeural"
  voice_shorts: "en-US-AvaNeural"
  rate_long: "+2%"
  rate_shorts: "+8%"
  pitch: "+0Hz"

video:
  # Saved Visual Style Presets (ubah engine_mode atau kirim --visual-style <nama>):
  #   "hybrid_cozy_3dpov"  (DEFAULT): YouTube Long 16:9 -> Cozy Diorama (v8.3) + Shorts/Reels/TikTok 9:16 -> 3D Cel-Shaded POV (v9)
  #   "pov_3d_toon"        (v9):   3D Cel-Shaded First-Person POV Cognitive Survival + Live Focus HUD + Interactive A/B Card
  #   "cozy_diorama"       (v8.3): Cozy Midnight Diorama + Expressive 6-Mood Character + Pastel Cream Cards + Serif Karaoke
  #   "minimal_line_story" (v7):   Dark Minimalist Mono-Line Stick-Figure Storytelling + Monospace Yellow-Highlight Subtitles
  #   "cinema_broll_html"  (v6):   Real HD/4K B-Roll fast cuts + HTML5 Frosted-Glass Vox & Bento Overlays + Cinema SFX
  #   "flat_vector_2d"     (v5):   Kurzgesagt/TED-Ed 30fps Flat Vector 2D
  #   "motion_hybrid"      (v4):   Programmatic Motion Graphics + B-Roll
  #   "ken_burns_images"   (v3):   Illustrated AI art + Ken Burns
  engine_mode: "hybrid_cozy_3dpov"
  # Closed-Loop Visual Style Optimizer: 80% pakai gaya visual pemenang views tertinggi,
  # 20% (setiap 5 run) uji gaya visual penantang (minimal_line_story / cinema_broll_html / cozy_diorama)
  auto_optimize_style: true
  style_explore_every_n_runs: 5
  broll_cut_interval_sec: 4.5
  cinema_sfx: true
  ken_burns_motion: true
  # Subtle calm warm ambient drone/pad behind voiceover (-27 dB, 100% royalty-free)
  # Put your own track at assets/bgm.mp3 to override the built-in ambient pad!
  ambient_bgm: true
  ambient_bgm_volume_db: -27
  animated_ass_subtitles: true
  youtube_long:
    width: 1920
    height: 1080
    fps: 30
    burn_subtitles: true
    padding_after_audio_sec: 0.45
  shorts:
    width: 1080
    height: 1920
    fps: 30
    burn_subtitles: true
    max_duration_sec: 59
    padding_after_audio_sec: 0.30

platforms:
  youtube_long:
    enabled: true
    category_id: "27"
    draft_privacy: "private"
    publish_privacy: "public"
    made_for_kids: false
  youtube_shorts:
    enabled: true
    category_id: "27"
    draft_privacy: "private"
    publish_privacy: "public"
    made_for_kids: false
  instagram_reels:
    enabled: true
    adapter: "direct"
  instagram_carousel:
    enabled: true
    slide_count: 5
    adapter: "direct"
  tiktok:
    enabled: true
    adapter: "direct"
  linkedin:
    enabled: true
    adapter: "direct"
  x_threads:
    enabled: true
    adapter: "direct"
  facebook:
    enabled: true
    adapter: "direct"

publishing:
  default_mode: "scheduled"
  save_payload_snapshots: true
  schedule:
    # US Eastern Prime Time slots (UTC):
    # YouTube Long = 16:00 UTC (11:00 AM EST / 23:00 WIB)
    # YouTube Shorts = 19:00 UTC (02:00 PM EST / 02:00 WIB)
    # Each newly produced episode auto-queues onto the NEXT distinct calendar date!
    youtube_long_hour_utc: 16
    youtube_shorts_hour_utc: 19
    us_prime_hours_utc: [14, 17, 21]

comment_bot:
  enabled: true
  # Safe daily YouTube reply cap (4 replies * 50 units = 200 units/day so 3x daily video uploads never hit quota!)
  youtube_daily_reply_cap: 4
  max_replies_per_platform_per_run: 6

trends:
  locale_hl: "en-US"
  locale_gl: "US"
  locale_ceid: "US:en"
  queries:
    - "neuroscience focus attention dopamine study"
    - "habit formation behavioral psychology research"
    - "deep work sleep cognitive performance science"
  custom_rss_feeds: []
