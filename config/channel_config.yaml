channel:
  name: "HabitSains"
  handle: "@HabitSains"
  niche: "Prophetic Habits, Authentic Sunnah, Qur'an Wisdom & Modern Brain Science"
  target_audience: "Global Muslim & mindful audiences seeking inner peace, Prophetic daily habits, authentic Qur'an/Hadith wisdom, and calm focus backed by everyday science"
  language: "en"
  tone: "warm, deeply calm, reverent, reflective everyday English (grade 6-7 clarity), zero academic jargon, authentic verified Qur'an & Sahih Hadith wisdom bridged naturally to everyday mind & habit science"
  cta_youtube: "Subscribe to HabitSains for daily Prophetic habits, Qur'an peace, and calm focus science. Share this reminder with someone who needs peace today."
  cta_social: "Save this Sunnah reminder for your week and share it with someone who needs calm today."

branding:
  # Studio v10 — Islamic Luminous Midnight, Antique Gold & Emerald Palette
  primary_color: "#F4C95D"
  secondary_color: "#38BDF8"
  accent_color: "#34D399"
  bg_dark: "#081226"
  bg_card: "#101E3A"
  text_primary: "#F8FAFC"
  text_muted: "#CBD5E1"
  watermark_text: "@HabitSains"
  font_bold: "bahnschrift.ttf"
  font_regular: "segoeui.ttf"

visual:
  style: "islamic_luminous"
  cinematic_full_bleed: true
  # Hide heavy lower-third when full-bleed art is active so animated captions shine unobstructed
  minimal_chapter_overlay: true
  prompt_prefix: >-
    Serene, luminous Islamic editorial illustration and atmospheric architectural
    artwork: glowing mosque silhouettes reflected in calm water at twilight, antique
    gold Islamic geometric starlight, tranquil desert dawn and lush green gardens,
    deep midnight indigo (#081226) balanced with luminous warm gold (#F4C95D) and
    soft emerald (#34D399) light. Strictly NO depiction of Prophets or sacred figures,
    NO human faces, NO text, NO letters, NO numbers, NO watermarks anywhere in the image.

ai:
  text_model: "gemini-3.8-flash"
  # Free Cloud Image Generation order:
  # 1) Antigravity --custom-assets (100% Free locally)
  # 2) Cloudflare Workers AI FLUX.1-schnell (100% Free tier in Cloud / GitHub Actions!)
  # 3) Gemini Image API (if billing enabled)
  use_cloudflare_flux: true
  cloudflare_image_model: "@cf/black-forest-labs/flux-1-schnell"
  use_gemini_images: true
  image_model: "gemini-3.1-flash-image"
  temperature: 0.78

voiceover:
  provider: "gemini_tts"
  gemini_tts_model: "gemini-3.8-flash-tts"
  # Warm, calm, reflective documentary narrator voices
  gemini_voice_long: "Charon"
  gemini_voice_shorts: "Puck"
  style_prompt_long: >-
    Speak as a deeply calm, warm, thoughtful reflective storyteller sharing Prophetic
    wisdom, Qur'anic peace, and everyday brain science. Use a gentle, grounded pace
    with natural thoughtful pauses before key reflections—sincere, soothing, clear,
    and respectful, never rushed, never hyped, never robotic. Read ONLY the spoken
    transcript below naturally:
  style_prompt_shorts: >-
    Speak with a warm, serene, deeply reflective and clear storytelling voice for
    short-form wisdom videos. Open softly with quiet intrigue, breathe naturally on
    meaningful lines, and leave viewers feeling calm and inspired—never loud, never
    rushed, never monotone. Read ONLY the spoken transcript below naturally:
  loudnorm: true
  # Edge TTS fallback (calm natural pace, zero rushed hype)
  voice_long: "en-US-BrianNeural"
  voice_shorts: "en-US-AndrewMultilingualNeural"
  rate_long: "-2%"
  rate_shorts: "+0%"
  pitch: "+0Hz"

video:
  # Saved Visual Style Presets (ubah engine_mode atau kirim --visual-style <nama>):
  #   "islamic_luminous_sky"    (v10 Pillar 1): Sky-Cycle Mosque Reflection / Nature Transformation + Amiri Calligraphy + Step Counter
  #   "islamic_gold_visualizer" (v10 Pillar 2): Obsidian & 24k Gold Radial Sunburst Visualizer + Word-by-Word Gold Karaoke
  #   "islamic_particle_map"    (v10 Pillar 3): Cosmic Morphing Particle Constellations + Gold Dalil + Outlined Reflective Subtitles
  #   "hybrid_cozy_3dpov"       (DEFAULT auto-router): Routes automatically via per-Pillar styles below!
  #   "pov_3d_toon"        (v9):   3D Cel-Shaded First-Person POV
  #   "cozy_diorama"       (v8.3): Cozy Midnight Diorama
  #   "minimal_line_story" (v7):   Dark Minimalist Mono-Line Stick-Figure Storytelling
  #   "cinema_broll_html"  (v6):   Real HD/4K B-Roll + HTML5 Frosted-Glass Overlays
  #   "flat_vector_2d"     (v5):   Flat Vector 2D Explainer
  #   "motion_hybrid"      (v4):   Programmatic Motion Graphics
  #   "ken_burns_images"   (v3):   Illustrated AI art + Ken Burns
  engine_mode: "hybrid_cozy_3dpov"
  # Beda gaya visual otomatis per Pillar Studio v10 (100% berbeda antar 3 slot harian!)
  pillar_visual_styles: true
  # Closed-Loop Visual Style Optimizer (fallback bila pillar_visual_styles: false)
  auto_optimize_style: true
  style_explore_every_n_runs: 5
  broll_cut_interval_sec: 4.5
  cinema_sfx: false
  ken_burns_motion: true
  # 100% Instrument-Free Nature Soundscapes ONLY (dawn_breeze / gentle_rain / calm_water — ZERO musical instruments!)
  ambient_bgm: true
  ambient_bgm_mode: "nature_only"
  nature_preset: "dawn_breeze"
  ambient_bgm_volume_db: -27
  animated_ass_subtitles: true
  youtube_long:
    width: 1920
    height: 1080
    fps: 30
    burn_subtitles: true
    padding_after_audio_sec: 0.45
  shorts:
    width: 1080
    height: 1920
    fps: 30
    burn_subtitles: true
    max_duration_sec: 59
    padding_after_audio_sec: 0.30

platforms:
  youtube_long:
    enabled: true
    category_id: "27"
    draft_privacy: "private"
    publish_privacy: "public"
    made_for_kids: false
  youtube_shorts:
    enabled: true
    category_id: "27"
    draft_privacy: "private"
    publish_privacy: "public"
    made_for_kids: false
  instagram_reels:
    enabled: true
    adapter: "direct"
  instagram_carousel:
    enabled: true
    slide_count: 5
    adapter: "direct"
  tiktok:
    enabled: true
    adapter: "direct"
  linkedin:
    enabled: true
    adapter: "direct"
  x_threads:
    enabled: true
    adapter: "direct"
  facebook:
    enabled: true
    adapter: "direct"

publishing:
  default_mode: "scheduled"
  save_payload_snapshots: true
  schedule:
    # US Eastern Prime Time slots (UTC):
    # YouTube Long = 16:00 UTC (11:00 AM EST / 23:00 WIB)
    # YouTube Shorts = 19:00 UTC (02:00 PM EST / 02:00 WIB)
    # Each newly produced episode auto-queues onto the NEXT distinct calendar date!
    youtube_long_hour_utc: 16
    youtube_shorts_hour_utc: 19
    us_prime_hours_utc: [14, 17, 21]

comment_bot:
  enabled: true
  # Safe daily YouTube reply cap (4 replies * 50 units = 200 units/day so 3x daily video uploads never hit quota!)
  youtube_daily_reply_cap: 4
  max_replies_per_platform_per_run: 6

content_pillars:
  rotation:
    - id: "prophetic_habits"
      label: "Prophetic Habits & Daily Sunnah"
      description: "Daily Prophetic routines, morning/night habits, Qailulah rest, Istiqamah consistency, and authentic Duas bridged naturally to everyday focus & habit science."
      visual_style_long: "islamic_luminous_sky"
      visual_style_short: "islamic_luminous_sky"
    - id: "quran_mental_peace"
      label: "Qur'an Wisdom & Mental Peace"
      description: "Authentic Qur'anic verses on inner calm (Sakinah), Dhikr, gratitude (Shukr), relief with hardship (Yusr), and Tawakkul paired with everyday mind & stress science."
      visual_style_long: "islamic_gold_visualizer"
      visual_style_short: "islamic_gold_visualizer"
    - id: "sunnah_brain_science"
      label: "Sunnah, Hadith & Brain Science"
      description: "Reflective storytelling & visual metaphors unpacking authentic Sahih Hadith and Prophetic principles alongside modern brain & health science."
      visual_style_long: "islamic_particle_map"
      visual_style_short: "islamic_particle_map"

trends:
  locale_hl: "en-US"
  locale_gl: "US"
  locale_ceid: "US:en"
  queries:
    - "islamic habits sunnah morning routine focus calm"
    - "quran mental peace anxiety gratitude science"
    - "prophetic sunnah fasting sleep health science"
  custom_rss_feeds: []
