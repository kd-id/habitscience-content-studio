name: Daily Analytics & Visual Style Optimizer

on:
  workflow_dispatch:
    inputs:
      send_telegram:
        description: "Kirim ringkasan performa & rekomendasi ke Telegram"
        type: boolean
        default: true
  # Jalan otomatis setiap hari pukul 19:13 WIB (12:13 UTC, Public Repo) — sebelum gelombang produksi 21:17 WIB!
  schedule:
    - cron: "13 12 * * *"

permissions:
  contents: write

concurrency:
  group: analytics-optimizer
  cancel-in-progress: false

jobs:
  analyze-and-optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lightweight dependencies
        run: pip install requests python-dotenv pyyaml google-genai google-api-python-client google-auth-oauthlib

      - name: Pull Multi-Platform Views, Rank Visual Styles & Generate Part 2 Sequels
        env:
          HEADLESS_CLOUD: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_NOTIFY: ${{ github.event.inputs.send_telegram || 'true' }}
        run: |
          if [ "$INPUT_NOTIFY" = "false" ]; then
            python -m src.analytics_engine --no-notify
          else
            python -m src.analytics_engine
          fi

      - name: Persist analytics_insights.json for closed-loop pipeline optimization
        if: success()
        run: |
          if [ -f output/analytics_insights.json ]; then
            git config user.name "content-automation-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -f output/analytics_insights.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(analytics): update daily performance insights & style winner [skip ci]"
              git pull --rebase --autostash origin main
              git push
            fi
          fi
